# Builds the Android app (android/) and tests its bot engine.
#   - every pull request and push to master or android: engine tests, then a release APK
#     uploaded as the "auto-naitra-apk" artifact (Actions tab -> the run -> Artifacts)
#   - a push of a tag v*: the APK is also attached to a GitHub release for that tag
#
# Signing: release builds use your own key when these repository secrets are set, else the
# debug key in android/app/debug.keystore (fine for installing it yourself):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password (defaults to the keystore password)
# An APK signed with one key cannot be installed over one signed with another: pick one and keep it.
name: Android

on:
  pull_request:
  push:
    branches: [master, android]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dashboard dependencies (the UI test builds it)
        run: npm ci
        working-directory: dashboard
      - run: npm ci && npm test
        working-directory: android/engine

  apk:
    needs: engine-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - id: v
        name: Version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="${base}.${{ github.run_number }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Android app $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key in android/app/debug.keystore."
          fi
      - name: Build the APK
        working-directory: android
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "auto-naitra-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: auto-naitra-apk
          path: android/auto-naitra-*.apk
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "auto-naitra $GITHUB_REF_NAME" --notes "Android app ${{ steps.v.outputs.version }}"
          gh release upload "$GITHUB_REF_NAME" android/auto-naitra-*.apk --clobber
